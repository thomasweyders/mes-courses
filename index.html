<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#237a3b"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="style.css"><title>Mes courses</title></head><body><header><h1>Mes courses</h1><p>Recettes → liste automatique</p><small>Version 11</small></header><main>
<section id="planner" class="screen"><h2>Repas</h2><div class="card"><label>Recette<select id="recipeSelect"></select></label><label>Personnes<input id="servings" type="number" min="1" value="4"></label><button id="addMeal">Ajouter</button></div><div id="mealList"></div><button id="buildList" class="primary">Générer la liste de courses</button><button id="clearMeals">Vider les repas sélectionnés</button></section>
<section id="shopping" class="screen hidden"><h2>Courses</h2><div id="shoppingList"></div></section>
<section id="recipes" class="screen hidden"><h2>Recettes</h2><div id="recipeList"></div><button id="newRecipe">Ajouter une recette</button><div id="recipeEditor" class="card hidden"><label>Nom<input id="recipeName"></label><label>Portions de référence<input id="recipeRef" type="number" min="1"></label><div class="photo"><h3>📷 Photo de la recette</h3><img id="photoPreview" class="hidden" alt="Aperçu"><label class="photoButton">🖼️ Choisir dans la photothèque<input id="photoInput" type="file" accept="image/*"></label><button id="takePhotoButton">📷 Prendre une nouvelle photo</button><input id="cameraInput" class="hidden" type="file" accept="image/*" capture="environment"><button id="removePhoto" class="hidden">Supprimer la photo</button></div><h3>Ingrédients</h3><div id="recipeIngredients"></div><button id="addRecipeIngredient">+ Ajouter un ingrédient</button><button id="saveRecipe" class="primary">Enregistrer</button><button id="deleteRecipe" class="danger hidden">Supprimer cette recette</button><button id="cancelRecipe">Annuler</button></div></section>
<section id="ingredients" class="screen hidden"><h2>Ingrédients</h2><div class="card"><label>Rechercher<input id="ingredientSearch" type="search"></label></div><div id="ingredientList"></div><button id="newIngredient">Ajouter un ingrédient</button><div id="ingredientEditor" class="card hidden"><label>Nom<input id="ingredientName"></label><label>Unité<input id="ingredientUnit"></label><label>Rayon<select id="ingredientAisle"></select></label><div class="inline"><input id="newAisle" placeholder="Nouveau rayon"><button id="addAisle">Créer</button></div><button id="saveIngredient" class="primary">Enregistrer</button><button id="deleteIngredient" class="danger hidden">Supprimer cet ingrédient</button><button id="cancelIngredient">Annuler</button></div></section>
<section id="backup" class="screen hidden"><h2>Sauvegarde</h2><button id="exportData">Exporter</button><label class="fileButton">Importer<input id="importData" type="file" accept=".json"></label></section></main>
<nav><button data-screen="planner" class="active">🍽️<span>Repas</span></button><button data-screen="shopping">🛒<span>Courses</span></button><button data-screen="recipes">📖<span>Recettes</span></button><button data-screen="ingredients">🥕<span>Ingrédients</span></button><button data-screen="backup">💾<span>Sauvegarde</span></button></nav><script src="data.js"></script><script src="app.js"></script></body></html>
